name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.2.0)'
        required: false
        default: 'latest'

env:
  DOCKER_USERNAME: zardkim
  BACKEND_IMAGE: zardkim/myappstore-backend
  FRONTEND_IMAGE: zardkim/myappstore-frontend

jobs:
  # 스키마 정본이 alembic/versions/ 하나라는 것을 CI 에서 강제한다.
  # 모델을 고치고 리비전을 만들지 않으면 여기서 빌드가 깨진다.
  # (2026-09 에 activity_logs / product_videos / share_links 세 테이블이
  #  Alembic 밖에서만 만들어지고 있던 드리프트가 실제로 쌓였었다)
  schema-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myappstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myappstore
      SECRET_KEY: ci-schema-check-only

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations to an empty database
        working-directory: ./backend
        run: alembic upgrade head

      - name: Verify models match migrations
        working-directory: ./backend
        run: |
          # 모델과 마이그레이션이 어긋나면 0 이 아닌 코드로 종료한다.
          # 의도적 예외(손수 만든 GIN 인덱스, 보류 중인 죽은 테이블/컬럼)는
          # alembic/env.py 의 include_object 에서 걸러진다.
          alembic check

  build-and-push:
    needs: schema-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate version tag
        id: version
        run: |
          # Git 태그가 있으면 사용
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # 수동 실행 시 입력 버전 사용
          elif [[ "${{ github.event.inputs.version }}" != "" && "${{ github.event.inputs.version }}" != "latest" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          # 자동 버전 생성: YYYYMMDD-HHMM-CommitSHA
          else
            DATE=$(date -u +"%Y%m%d-%H%M")
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            AUTO_VERSION="${DATE}-${SHORT_SHA}"
            echo "version=${AUTO_VERSION}" >> $GITHUB_OUTPUT
            echo "Generated auto version: ${AUTO_VERSION}"
          fi

      - name: Get build date (ISO 8601)
        id: build_date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Generate Backend image tags
        id: backend_tags
        run: |
          TAGS="${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}"
          TAGS="${TAGS},${{ env.BACKEND_IMAGE }}:latest"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Generate Frontend image tags
        id: frontend_tags
        run: |
          TAGS="${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}"
          TAGS="${TAGS},${{ env.FRONTEND_IMAGE }}:latest"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend_tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend_tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

      - name: Build summary
        run: |
          echo "=========================================="
          echo "Docker Images Built Successfully"
          echo "=========================================="
          echo ""
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Build Date: ${{ steps.build_date.outputs.date }}"
          echo "Git SHA: ${{ github.sha }}"
          echo ""
          echo "Backend Image:"
          echo "  - ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo "  - ${{ env.BACKEND_IMAGE }}:latest"
          echo ""
          echo "Frontend Image:"
          echo "  - ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}"
          echo "  - ${{ env.FRONTEND_IMAGE }}:latest"
          echo ""
          echo "=========================================="
          echo "Synology Container Manager update:"
          echo "  Container Manager > 레지스트리 > 이미지 선택 > 업데이트 확인"
          echo "  또는 SSH: docker-compose pull && docker-compose up -d"
          echo "=========================================="
