version: '3.8'

services:
  db:
    image: postgres:15.19-alpine
    container_name: myapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-myappstore}
    volumes:
      - ./db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myapp-redis
    restart: unless-stopped
    volumes:
      - ./redis:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: zardkim/myappstore-backend:latest
    container_name: myapp-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      # ── 라이브러리 추가 폴더 마운트 (선택) ──────────────────────────
      # 형식: /시놀로지경로:/app/data/library/표시될이름[:ro]
      #
      # ⚠️ 여기에 추가한 항목은 아래 frontend volumes에도 **똑같이** 넣어야 합니다.
      #    빠뜨리면 Nginx가 파일을 읽지 못해 해당 폴더의 다운로드가 404로 실패합니다.
      #    (백엔드만 파일이 보이므로 스캔·목록은 정상이라 발견이 늦습니다)
      #
      # 실제 운영 예시:
      # - /volume2/App:/app/data/library/App:ro
      # - /volume3/App2:/app/data/library/App2:ro
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-myappstore}
      - DB_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-myappstore}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - SCAN_BASE_PATH=/app/data/library
      - ICON_CACHE_DIR=/app/data/icons
      - SCREENSHOT_CACHE_DIR=/app/data/screenshots
      - EXIMAGE_DIR=/app/data/eximage
      - PATCHES_DIR=/app/data/patches
      - ATTACHMENTS_DIR=/app/data/attachments
      - VIDEOS_DIR=/app/data/videos
      - CONFIG_DATA_DIR=/app/data
      - LOG_DIR=/app/data/logs
      - SCAN_EXCLUSIONS_FILE=/app/data/scan_exclusions.txt
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - HOST=0.0.0.0
      - PORT=${BACKEND_PORT:-8110}
      - BACKEND_URL=http://localhost:${BACKEND_PORT:-8110}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "${BACKEND_PORT:-8110}:8110"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: zardkim/myappstore-frontend:latest
    container_name: myapp-frontend
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
      # ⚠️ 위 backend volumes에 추가한 라이브러리 폴더를 여기에도 :ro 로 그대로 넣으세요.
      #    Nginx가 X-Accel-Redirect로 파일을 직접 서빙하므로(다운로드 이어받기 지원),
      #    누락되면 해당 폴더의 다운로드가 404로 실패합니다.
      #
      # backend와 동일하게:
      # - /volume2/App:/app/data/library/App:ro
      # - /volume3/App2:/app/data/library/App2:ro
    ports:
      - "${FRONTEND_PORT:-5900}:5900"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8110/api}
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8110}
      - VITE_APP_URL=${VITE_APP_URL:-http://localhost:5900}
    depends_on:
      - backend
