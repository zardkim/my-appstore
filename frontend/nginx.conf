server {
    listen 5900;
    server_name _;

    # proxy_pass 에 변수를 쓰면 Nginx 가 런타임에 호스트명을 해석해야 한다.
    # Docker 내장 DNS 주소를 지정한다 (@download_fallback 에서 사용).
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # index.html은 절대 캐시하지 않는다.
    # 이 파일이 캐시되면(특히 홈 화면에 추가한 PWA) 재배포로 해시가 바뀐 지연 로드
    # 청크를 404로 받게 되고, vue-router의 동적 import가 조용히 실패해서
    # 상세 페이지 전환이 아무 반응 없이 멈춘다.
    # index.html 안의 <meta http-equiv="Cache-Control">은 브라우저가 캐시 판단에
    # 쓰지 않으므로 반드시 실제 HTTP 헤더로 내려야 한다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 빌드 산출물(내용 해시 파일명) - 장기 캐시.
    # try_files ... =404로 두어 없는 청크가 index.html(HTML)로 응답되지 않게 한다.
    # HTML을 모듈로 import하면 원인 파악이 어려운 MIME 오류가 난다.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 그 외 정적 파일 캐싱 (아이콘, 폰트 등)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # File upload size limit (for patch/crack file uploads)
    client_max_body_size 2g;

    # API proxy - Forward /api requests to backend container
    location /api {
        proxy_pass http://backend:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (extended for large file uploads/downloads)
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # X-Accel-Redirect internal location for file downloads (version files)
    # Backend's /api/download/{version_id} sets the X-Accel-Redirect header
    # pointing here; Nginx then serves the actual bytes directly from the
    # shared library volume via sendfile. This gives native HTTP Range
    # (resumable/paused downloads) support for free, with no backend code.
    # "internal" blocks any direct external request to this path.
    location /protected/ {
        internal;
        alias /app/data/library/;

        # Nginx 가 파일을 못 읽으면 백엔드 스트리밍으로 되돌린다.
        #
        # Nginx 워커는 uid 101(nginx)로 돌고 백엔드는 root 로 돈다. 라이브러리에
        # others 읽기 권한이 없는 파일은 Nginx 만 403 을 내고 백엔드는 읽을 수 있다.
        # 2026-10-06 운영에서 281개 중 38개가 이 상태였다(네트워크 관련 / CD&DVD /
        # VMware 제품군 / 맥 자료실 일부).
        #
        # 근본 해결은 파일 권한을 고치는 것이고, 이건 그동안 다운로드가 조용히
        # 실패하지 않게 하는 안전망이다. 폴백 경로는 Range 도 지원한다(FileResponse).
        error_page 403 404 = @download_fallback;
    }

    # 원래 요청(/api/download/{id}?token=...)을 백엔드로 다시 보낸다.
    # X-Accel-Fallback 헤더를 보고 백엔드가 X-Accel 대신 직접 스트리밍한다 -
    # 이 헤더가 무한 루프를 막는다.
    location @download_fallback {
        internal;
        set $download_fallback_url "http://backend:8110$request_uri";
        proxy_set_header X-Accel-Fallback "1";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Range $http_range;
        # X-Accel-Redirect 시 Nginx 가 원래 응답의 헤더를 유지하므로, 폴백 응답이
        # 같은 헤더를 또 보내면 Content-Disposition 이 중복으로 나간다. 숨긴다.
        proxy_hide_header Content-Disposition;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass $download_fallback_url;
    }

    # Static files proxy - Forward /static requests to backend container
    # This includes icons, screenshots, and other uploaded files
    # ^~ ensures this takes priority over regex location for caching
    location ^~ /static {
        proxy_pass http://backend:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static files
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    # 주의: error_page 404 /index.html 을 두지 않는다.
    # SPA 라우트는 아래 location / 의 try_files가 이미 처리하며,
    # 전역 404 -> index.html은 없는 JS 청크까지 HTML로 응답하게 만든다.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
